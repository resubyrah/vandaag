<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Vandaag</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ccircle cx='32' cy='16' r='7' fill='%23ffd251'/%3E%3Cpath d='M17 33l10 10 20-22' stroke='%23ffffff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#111827; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eff4ff; --line:#e5e7eb;
  --ochtend:#f59e0b; --middag:#10b981; --avond:#6366f1;
  --radius:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
.date{color:var(--muted);font-size:13px}
.spacer{flex:1}
.badge{border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;color:var(--ink)}
.badge:hover{border-color:var(--accent)}
.badge.open{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}
.badge .count{font-size:11px;background:rgba(0,0,0,.06);border-radius:999px;padding:1px 7px;color:var(--muted)}
.badges{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 4px;align-items:center}
.badges .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.badge.ochtend.open{color:#b45309;background:#fffbeb;border-color:var(--ochtend)}
.badge.middag.open{color:#047857;background:#ecfdf5;border-color:var(--middag)}
.badge.avond.open{color:#4338ca;background:#eef2ff;border-color:var(--avond)}
.grid{display:grid;gap:14px;padding:14px 16px 90px;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));max-width:1200px;margin:0 auto}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;min-height:120px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column}
.col.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.col h2{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.col h2 .stripe{flex:1;height:3px;border-radius:2px;background:var(--c,var(--line))}
.add{display:flex;gap:6px;margin-bottom:8px}
.add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:#fafafa}
.add input:focus{outline:none;border-color:var(--accent);background:#fff}
.add button{border:none;background:var(--accent);color:#fff;border-radius:10px;
  padding:8px 11px;font-size:14px;cursor:pointer}
.item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:10px;border-bottom:1px solid #f0f0f0;cursor:grab}
.item:last-child{border-bottom:none}
.item:hover{background:#fafafa}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item .txt{flex:1;font-size:14px;word-break:break-word}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.item .mv,.item .del{border:none;background:none;cursor:pointer;font-size:15px;color:var(--muted);padding:2px 4px;border-radius:6px}
.item .mv:hover{background:var(--accent-soft);color:var(--accent)}
.item .del:hover{background:#fee2e2;color:#dc2626}
.empty{color:#bbb;font-size:13px;text-align:center;padding:14px 0;font-style:italic}
menu.move{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);padding:6px;min-width:190px;margin:0}
menu.move button{display:block;width:100%;text-align:left;border:none;background:none;font-size:14px;
  padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
menu.move button:hover{background:var(--accent-soft)}
#status{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:center;pointer-events:none}
#status>div{background:#0f172a;color:#fff;font-size:12.5px;padding:6px 14px;border-radius:999px;opacity:0;transition:.3s}
#status>div.show{opacity:.92}
#ver{color:#9ca3af;font-size:11px}
#syncbar{color:#9ca3af;font-size:11px}
.col h2 .min{border:none;background:#f1f3f7;color:var(--muted);border-radius:999px;
  width:20px;height:20px;line-height:1;cursor:pointer;font-weight:700;font-size:14px;padding:0}
.col h2 .min:hover{background:var(--accent-soft);color:var(--accent)}
dialog#hist{border:none;border-radius:16px;padding:24px;max-width:420px;width:92vw;
  box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:80vh;display:flex;flex-direction:column}
dialog#hist::backdrop{background:rgba(15,23,42,.4)}
dialog#hist h3{margin:0 0 2px}
dialog#hist p{color:var(--muted);font-size:12.5px;margin:0 0 12px}
#histBox{overflow:auto;min-height:60px}
#histBox h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#histBox .item{cursor:default}
#histBox .hlist{font-size:11px;color:var(--muted);background:#f1f3f7;border-radius:999px;padding:2px 8px}
dialog#login{border:none;border-radius:16px;padding:26px;max-width:330px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog#login::backdrop{background:rgba(15,23,42,.4)}
dialog#login h3{margin:0 0 6px}
dialog#login p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;margin:0 4px}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:#eef0f4;color:var(--ink)}
@media (max-width:560px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Vandaag</h1>
  <span class="date" id="date"></span>
  <span class="spacer"></span>
  <span id="ver"></span>
  <span id="syncbar"></span>
  <button class="badge" id="histBtn" title="Historie">🕘</button>
  <button class="badge" id="authBtn">🔑 Inloggen</button>
</header>

<div class="badges" id="badges"></div>
<div class="grid" id="grid"></div>

<div id="status"><div id="toast"></div></div>

<dialog id="login">
  <h3>Vandaag — cloud</h3>
  <p>Log in met je Google-account om je lijsten automatisch als JSON-files in Google Drive op te slaan (via Google Apps Script). Zonder login werkt de app lokaal op dit apparaat.</p>
  <button class="btn pri" id="loginGo">Inloggen met Google</button>
  <button class="btn sec" id="loginNo">Lokaal gebruiken</button>
</dialog>

<dialog id="hist">
  <h3>🕘 Historie</h3>
  <p>Afgevinkte taken blijven hier opvraagbaar per dag — ↩ zet een taak terug.</p>
  <input id="histSearch" type="search" placeholder="🔍 zoeken in historie…"
    style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:6px" />
  <div id="histBox"></div>
  <div style="margin-top:16px">
    <button class="btn sec" id="histClear">Wis historie</button>
    <button class="btn pri" id="histClose">Sluiten</button>
  </div>
</dialog>

<script>
/* ============================================================
   CONFIG — hier je eigen waarden invullen
   ============================================================ */
const CONFIG = {
  // OAuth Client-ID (Web application); origins: hosting-URL + evt. localhost
  CLIENT_ID: "513652605614-574ln2us0bbgrfjtlc4pj1f68ja0m820.apps.googleusercontent.com",
  // Deploy-URL van het Apps Script-web-app (Code.gs):  /exec
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzamyI7CO1jr7pP3q4redliWCmTEbSD55G2j7p7yxUAHv9L-B7V0s4kNMXduk4KbaOr/exec",
  DAY_PARTS: [
    { key:"ochtend", name:"Ochtend", color:"var(--ochtend)" },
    { key:"middag",  name:"Middag",  color:"var(--middag)"  },
    { key:"avond",   name:"Avond",   color:"var(--avond)"   }
  ]
};

/* ============ VERSIONERING ============ */
/* Bij elke release: dit verhogen (semantic: breaking.feature.fix)
   én de cache-naam in sw.js mee-verhogen. */
const VERSION = "0.3.0";

/* ============================================================
   State & opslag — per badge (lijst) één JSON-file
   ============================================================ */
const LS_KEY = "vandaag_state_v1";
const DAY_KEYS = CONFIG.DAY_PARTS.map(d => d.key);
let state = { topics: [], lists: {}, history: { name:"Historie", items: [] }, lastDay: null };
// lists: { key: {name,color,items:[{id,text,done,doneAt,created}],updated} }
let openLists = new Set(DAY_KEYS);        // dagdelen zijn badges en staan default open
let activeTopic = null;
let user = null, accessToken = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const listKey = t => "topic:" + t;

function loadLocal(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s){ state = s; openLists = new Set(s.openLists || DAY_KEYS); activeTopic = s.activeTopic || null; }
  }catch(e){}
  if(!state.lists) state.lists = {};
  for(const d of CONFIG.DAY_PARTS) if(!state.lists[d.key]) state.lists[d.key] = { name:d.name, color:d.color, items:[] };
  if(!state.history) state.history = { name:"Historie", items: [] };
  if(s.dirty) s.dirty.forEach(k => dirtyKeys.add(k));   // ongepushte wijzigingen na herstart opnieuw syncen
  if(!state.lastDay) state.lastDay = todayStr();
}
function saveLocal(){
  state.openLists = [...openLists]; state.activeTopic = activeTopic;
  state.dirty = [...dirtyKeys];
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

/* ============================================================
   Google login — Google Identity Services (oauth token)
   ============================================================ */
let tokenClient = null;
function initGIS(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: "openid email profile",
    callback: async (resp) => {
      if(!resp.access_token) return;
      accessToken = resp.access_token;
      try{
        const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo",
          { headers:{ Authorization:"Bearer " + accessToken }});
        const info = await r.json();
        user = info.email;
      }catch(e){}
      updateAuthBtn();
      toast(user ? "Ingelogd als " + user + " — sync met Drive" : "Ingelogd");
      pull(true);      // serverdata ophalen
      pushDirty();     // eigen openstaande wijzigingen erheen
      updateSyncBar();
    }
  });
  return true;
}
function loginFlow(){
  if(CONFIG.CLIENT_ID.startsWith("JOUW_")){ toast("Vul eerst je CLIENT_ID in bij CONFIG"); return; }
  if(!window.google){ toast("Google-login hier niet beschikbaar"); return; }
  if(!tokenClient) initGIS();
  tokenClient.requestAccessToken({ prompt: "" });
}
function logout(){
  if(accessToken && window.google) try{ google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  user = null; accessToken = null;
  updateAuthBtn(); toast("Uitgelogd — alleen lokaal");
}
function updateAuthBtn(){
  const b = document.getElementById("authBtn");
  b.textContent = user ? "🔓 " + user : "🔑 Inloggen";
  b.classList.toggle("open", !!user);
}

/* ============================================================
   Backend — Google Apps Script, per badge één JSON in Drive
   ============================================================ */
async function api(action, key, data){
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: "POST",
    // text/plain vermijdt CORS-preflight bij Apps Script
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, key, data, token: accessToken })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const r = await res.json();
  if(r && r.ok === false && r.error === "locked") throw new Error("locked");
  return r;
}
/* ============================================================
   Optimistic syncing (zoals de bandplan-app)
   - elke mutatie: meteen lokaal zichtbaar + bewaard (optimistic)
   - push debounce 5 s: vlug tikken achter elkaar = één batch
   - mislukte push: bewaard op dit apparaat, over 10 s opnieuw
   - pull elke 10 s (alleen als tab zichtbaar) + bij tab-focus;
     server wint nooit voor lijsten met eigen ongepushte wijzigingen
   ============================================================ */
const dirtyKeys = new Set();
let pushTimer = null, retryTimer = null;

function markDirty(key){
  dirtyKeys.add(key);
  saveLocal();
  if(!accessToken) return;
  updateSyncBar("syncing…");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushDirty, 5000);
}
async function pushDirty(){
  if(!accessToken || !dirtyKeys.size) return;
  const keys = [...dirtyKeys];
  try{
    for(const k of keys){
      if(!state.lists[k] && k !== "history"){ dirtyKeys.delete(k); continue; }
      const payload = k === "history"
        ? { name: "Historie", items: state.history.items, updated: nowISO() }
        : { name: state.lists[k].name, color: state.lists[k].color, items: state.lists[k].items, updated: nowISO() };
      await api("put", k, payload);
      dirtyKeys.delete(k);
    }
    updateSyncBar("gesynchroniseerd");
    pull();                       // meteen andermans wijzigingen ophalen
  }catch(e){
    updateSyncBar(e && e.message === "locked"
      ? "tijdelijk geblokkeerd (te veel mislukte pogingen) — over enkele minuten opnieuw"
      : "sync mislukt — probeert over 10 s opnieuw");
    clearTimeout(retryTimer);
    retryTimer = setTimeout(pushDirty, 10000);
  }
}
async function pull(force){
  if(!accessToken) return;
  if(!force && dirtyKeys.size) return;   // niet over eigen werk heen schrijven
  try{
    const r = await api("getAll");
    const files = r.files || {};
    let changed = false;
    for(const k of Object.keys(files)){
      const srv = files[k];
      if(!srv || !srv.items && !srv.name) continue;
      if(k === "history"){
        if(!dirtyKeys.has("history") && (srv.items||[]).length >= (state.history.items||[]).length
           && (srv.updated||"") > (state.history.updated||"")){
          state.history = srv; changed = true;
        }
        continue;
      }
      if(!state.lists[k]){
        state.lists[k] = srv; changed = true;
        // onderwerpen op een ander apparaat aangemaakt → hier overnemen
        if(k.startsWith("topic:") && !state.topics.some(t => listKey(t.id) === k))
          state.topics.push({ id: k.slice(6), name: srv.name });
      } else if(!dirtyKeys.has(k) && (srv.updated || "") > (state.lists[k].updated || "")){
        state.lists[k] = srv; changed = true;
      }
    }
    if(changed){ render(); updateSyncBar("gesynchroniseerd"); }
  }catch(e){ /* volgende poll weer proberen */ }
}
function updateSyncBar(txt){
  const s = document.getElementById("syncbar");
  if(!s) return;
  if(!accessToken){ s.textContent = ""; return; }
  s.textContent = "· " + (txt || (dirtyKeys.size ? "te synchroniseren" : "gesynchroniseerd"));
}

/* ============================================================
   Dagrollover & historie
   Afgevinkte taken (dagdelen ÉN onderwerpen) verdwijnen pas de
   volgende dag en gaan naar de historie (opvraagbaar via 🕘,
   met zoekveld en "terug naar vandaag").
   ============================================================ */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function nowISO(){
  const d = new Date();
  return todayStr() + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function rollover(){
  const today = todayStr();
  if(state.lastDay === today) return 0;
  state.lastDay = today;
  let n = 0;
  for(const k of Object.keys(state.lists)){
    const l = state.lists[k]; if(!l || !l.items) continue;
    const stay = [];
    let changed = false;
    for(const it of l.items){
      if(it.done && it.doneAt && it.doneAt.slice(0,10) < today){
        state.history.items.push({ id: it.id, text: it.text, doneAt: it.doneAt, list: l.name, key: k });
        n++; changed = true;
      } else stay.push(it);
    }
    if(changed){ l.items = stay; dirtyKeys.add(k); }
  }
  if(n) dirtyKeys.add("history");
  return n;
}
function showHistory(){
  document.getElementById("histSearch").value = "";
  renderHistory("");
  document.getElementById("hist").showModal();
}
function restoreFromHistory(id){
  const idx = state.history.items.findIndex(x => x.id === id);
  if(idx < 0) return;
  const it = state.history.items[idx];
  // terug naar de originele lijst; bestaat die niet meer → ochtend
  const target = (it.key && state.lists[it.key]) ? it.key : DAY_KEYS[0];
  state.lists[target].items.push({ id: it.id, text: it.text, done:false, doneAt:null, created: nowISO() });
  state.history.items.splice(idx, 1);
  markDirty("history"); markDirty(target);
  renderHistory(document.getElementById("histSearch").value);
  toast("Teruggezet naar " + state.lists[target].name);
}
function renderHistory(q){
  const box = document.getElementById("histBox");
  box.innerHTML = "";
  q = (q || "").trim().toLowerCase();
  const items = (state.history.items || []).slice()
    .filter(it => !q || (it.text || "").toLowerCase().includes(q) || (it.list || "").toLowerCase().includes(q))
    .sort((a,b) => (b.doneAt || "").localeCompare(a.doneAt || ""));
  if(!items.length){
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = q ? "niets gevonden" : "Nog geen afgeronde taken — vandaag begint de teller.";
    box.appendChild(e);
    return;
  }
  let curDate = "";
  for(const it of items){
    const d = (it.doneAt || "").slice(0,10);
    if(d !== curDate){
      curDate = d;
      const h = document.createElement("h4");
      h.textContent = new Date(d + "T12:00").toLocaleDateString("nl-NL",
        { weekday:"long", day:"numeric", month:"long" });
      box.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "item done";
    const txt = document.createElement("span"); txt.className = "txt"; txt.textContent = it.text;
    const lst = document.createElement("span"); lst.className = "hlist"; lst.textContent = it.list || "";
    const back = document.createElement("button"); back.className = "mv"; back.title = "Terug naar vandaag"; back.textContent = "↩";
    back.onclick = () => restoreFromHistory(it.id);
    row.append(txt, lst, back);
    box.appendChild(row);
  }
}

/* ============================================================
   UI
   ============================================================ */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}
function render(){ renderBadges(); renderGrid(); saveLocal(); }

function renderBadges(){
  const el = document.getElementById("badges"); el.innerHTML = "";
  const lbl = document.createElement("span"); lbl.className="lbl"; lbl.textContent="Lijsten";
  el.appendChild(lbl);

  const mkBadge = (key, {removeable}={}) => {
    const list = state.lists[key];
    const b = document.createElement("button");
    b.className = "badge" + (openLists.has(key) ? " open " + key : "");
    const open = list.items.filter(i=>!i.done).length;
    b.innerHTML = `<span class="dot"></span>${list.name}<span class="count">${open}</span>`;
    b.onclick = e => { if(removeable && e.shiftKey){ deleteTopic(key); } else toggleList(key); };
    b.oncontextmenu = e => { if(removeable){ e.preventDefault(); deleteTopic(key); } };
    return b;
  };

  // open lijsten hebben geen badge meer: minimaliseren via de −-knop in de kolomkop
  for(const d of CONFIG.DAY_PARTS) if(!openLists.has(d.key)) el.appendChild(mkBadge(d.key));
  for(const t of state.topics) if(!openLists.has(listKey(t.id))) el.appendChild(mkBadge(listKey(t.id), {removeable:true}));
  const add = document.createElement("button");
  add.className = "badge"; add.textContent = "+ onderwerp";
  add.onclick = addTopic;
  el.appendChild(add);
}

function toggleList(key){
  if(openLists.has(key)){
    openLists.delete(key);          // badge verschijnt weer in de badgerij
    if(key === activeTopic) activeTopic = null;
  } else {
    openLists.add(key);
    if(key.startsWith("topic:")) activeTopic = key;
  }
  render();
}
function addTopic(){
  const name = prompt("Naam van het onderwerp:");
  if(!name || !name.trim()) return;
  const id = uid(), key = listKey(id);
  state.topics.push({ id, name: name.trim() });
  state.lists[key] = { name: name.trim(), items: [] };
  openLists.add(key); activeTopic = key;
  render(); markDirty(key);
}
function deleteTopic(key){
  if(!confirm('Onderwerp "' + state.lists[key].name + '" incl. taken verwijderen?')) return;
  const id = key.slice(6);
  state.topics = state.topics.filter(t => t.id !== id);
  delete state.lists[key];
  openLists.delete(key);
  if(activeTopic === key) activeTopic = null;
  render();
  if(accessToken) api("del", key).catch(()=>{});   // JSON-file op Drive opruimen
}

function renderGrid(){
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const key of openLists) g.appendChild(makeColumn(key, state.lists[key]));
}

function makeColumn(key, list){
  const col = document.createElement("section");
  col.className = "col"; col.dataset.key = key;
  const h = document.createElement("h2");
  h.textContent = list.name;
  const stripe = document.createElement("span");
  stripe.className = "stripe"; stripe.style.setProperty("--c", list.color || "var(--line)");
  h.appendChild(stripe);
  const min = document.createElement("button");
  min.className = "min"; min.textContent = "–"; min.title = "Minimaliseren — badge komt terug in de rij";
  min.onclick = () => toggleList(key);
  h.appendChild(min);
  col.appendChild(h);

  const add = document.createElement("div"); add.className = "add";
  const inp = document.createElement("input"); inp.placeholder = "+ taak voor " + list.name.toLowerCase();
  const btn = document.createElement("button"); btn.textContent = "＋";
  const doAdd = () => {
    const v = inp.value.trim(); if(!v) return;
    list.items.push({ id: uid(), text: v, done:false, created: new Date().toISOString() });
    inp.value = ""; render(); markDirty(key);
  };
  btn.onclick = doAdd; inp.onkeydown = e => { if(e.key === "Enter") doAdd(); };
  add.append(inp, btn); col.appendChild(add);

  const box = document.createElement("div");
  if(!list.items.length){ const e = document.createElement("div"); e.className="empty";
    e.textContent = "leeg — voeg een taak toe of sleep er een heen"; box.appendChild(e); }
  for(const it of list.items) box.appendChild(makeItem(key, list, it));
  col.appendChild(box);

  // drag & drop tussen open lijsten
  col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
  col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
  col.addEventListener("drop", e => {
    e.preventDefault(); col.classList.remove("drag-over");
    const [srcKey, itemId] = e.dataTransfer.getData("text/plain").split("|");
    moveItem(srcKey, key, itemId);
  });
  return col;
}

function makeItem(key, list, it){
  const el = document.createElement("div");
  el.className = "item" + (it.done ? " done" : "");
  el.draggable = true;
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = it.done;
  const txt = document.createElement("span"); txt.className = "txt"; txt.textContent = it.text;
  const mv = document.createElement("button"); mv.className = "mv"; mv.title = "Verplaatsen"; mv.textContent = "⇄";
  const del = document.createElement("button"); del.className = "del"; del.title = "Verwijderen"; del.textContent = "✕";
  el.append(cb, txt, mv, del);
  el.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", key + "|" + it.id));
  cb.onchange = () => {
    it.done = cb.checked;
    it.doneAt = cb.checked ? nowISO() : null;   // datum van afvinken → rollover & historie
    render(); markDirty(key);
  };
  txt.onclick = () => { const v = prompt("Taak aanpassen:", it.text);
    if(v && v.trim()){ it.text = v.trim(); render(); markDirty(key); } };
  del.onclick = () => { list.items = list.items.filter(x => x.id !== it.id); render(); markDirty(key); };
  mv.onclick = e => showMoveMenu(e, key, it.id);
  return el;
}

function showMoveMenu(e, srcKey, itemId){
  document.querySelector("menu.move")?.remove();
  const m = document.createElement("menu"); m.className = "move";
  const mk = (label, fn) => { const b = document.createElement("button"); b.textContent = label;
    b.onclick = () => { m.remove(); fn(); }; m.appendChild(b); };
  for(const k of openLists) if(k !== srcKey)
    mk("→ " + state.lists[k].name, () => moveItem(srcKey, k, itemId));
  for(const t of state.topics) if(!openLists.has(listKey(t.id)))
    mk("→ " + t.name + " (opent)", () => { openLists.add(listKey(t.id)); moveItem(srcKey, listKey(t.id), itemId); });
  document.body.appendChild(m);
  const r = e.target.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 200) + "px";
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 10) + "px";
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once:true }), 10);
}

function moveItem(srcKey, dstKey, itemId){
  if(srcKey === dstKey || !state.lists[srcKey] || !state.lists[dstKey]) return;
  const it = state.lists[srcKey].items.find(x => x.id === itemId); if(!it) return;
  state.lists[srcKey].items = state.lists[srcKey].items.filter(x => x.id !== itemId);
  state.lists[dstKey].items.push(it);
  render(); markDirty(srcKey); markDirty(dstKey);
  toast("Verplaatst naar " + state.lists[dstKey].name);
}
